<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TypeRush · teste de digitação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1020;--bg2:#141B34;--panel:#141B34;--panel2:#1B2447;--ink:#E8ECFF;--mute:#7F8AB5;--bad:#FF5C7A;--badbg:#3A1830;--acc:#8B6BFF;--gold:#FFC53D;--mint:#3DDC97;--line:#263058;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#EEF0FA;--bg2:#E3E7F7;--panel:#FFFFFF;--panel2:#F2F4FD;--ink:#151B38;--mute:#5E688F;--bad:#D4264A;--badbg:#FDE1E8;--acc:#5B3FE0;--gold:#B7791F;--mint:#0E9F6E;--line:#D3D9F0;color-scheme:light}}
:root[data-theme="light"]{--bg:#EEF0FA;--bg2:#E3E7F7;--panel:#FFFFFF;--panel2:#F2F4FD;--ink:#151B38;--mute:#5E688F;--bad:#D4264A;--badbg:#FDE1E8;--acc:#5B3FE0;--gold:#B7791F;--mint:#0E9F6E;--line:#D3D9F0;color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 "Chakra Petch",system-ui,sans-serif;background:radial-gradient(900px 420px at 50% -120px,color-mix(in srgb,var(--acc) 28%,transparent),transparent),var(--bg)}
main{max-width:1000px;margin:0 auto;padding:40px 28px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:40px}
.logo{font-size:1.7rem;font-weight:700;letter-spacing:-.01em;margin:0}.logo i{font-style:normal;color:var(--acc)}
.tools{display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem}
.chip b{color:var(--gold)}
button{font:inherit;color:inherit;cursor:pointer}
.ic{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.modes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px}
.modes button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 18px;font-weight:600;color:var(--mute);transition:.15s}
.modes button:hover{color:var(--ink);border-color:var(--acc)}
.modes button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 6px 22px -8px var(--acc)}
.bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-bottom:22px}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--mint));transition:width .12s linear}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px}
.card b{display:block;font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.card span{color:var(--mute);font-size:.82rem}
.card.w b{color:var(--acc)}.card.c b{color:var(--gold)}
.card.c.pop b{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.25)}}
.box{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px 36px;cursor:text;transition:.2s}
.box.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 18px 60px -24px var(--acc)}
.box.shake{animation:sh .12s}
@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#words{height:calc(3*2.15em);overflow:hidden;position:relative;font:400 clamp(1.1rem,3vw,1.5rem)/2.15 "JetBrains Mono",ui-monospace,monospace;color:var(--mute);letter-spacing:.04em;word-spacing:.2em}
.w{display:inline-block}
#words span.ok{color:var(--ink)}
#words span.bad{color:var(--bad);background:var(--badbg);border-radius:3px}
#words span.cur{background:color-mix(in srgb,var(--acc) 35%,transparent);border-radius:3px;box-shadow:0 2px 0 var(--acc)}
#inp{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;cursor:text}
.hint{color:var(--mute);font-size:.88rem;margin:20px 2px 0}
kbd{font:500 .78rem "JetBrains Mono",monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--panel)}
#res{background:var(--panel);border:1px solid var(--acc);border-radius:16px;padding:36px;box-shadow:0 18px 60px -28px var(--acc)}
.rk{display:inline-block;background:var(--gold);color:#1A1300;font-weight:700;border-radius:8px;padding:2px 12px;margin-bottom:8px}
.rbig{display:flex;gap:34px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 12px}
.rbig b{display:block;font-size:clamp(2.6rem,9vw,4.2rem);line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.rbig span{color:var(--mute);font-size:.85rem}
#res p{color:var(--mute);margin:0 0 14px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{border:0;background:var(--acc);color:#fff;padding:11px 22px;border-radius:10px;font-weight:700;box-shadow:0 8px 24px -10px var(--acc)}
.btn.alt{background:none;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;margin-top:56px;transition:opacity .4s}
.grid section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 26px}
.wide{grid-column:1/-1}
h2{font-size:1rem;font-weight:700;margin:0 0 16px}
.rec{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border:0}
.rec b{font-variant-numeric:tabular-nums}
.week{display:flex;gap:8px;margin:10px 0}
.week div{flex:1;text-align:center;font-size:.75rem;color:var(--mute)}
.week i{display:block;height:26px;border-radius:7px;background:var(--panel2);margin-bottom:4px}
.week .on i{background:var(--mint)}
.chart{overflow-x:auto}svg{width:100%;min-width:420px;height:auto;display:block}
.empty{color:var(--mute);margin:0;font-size:.9rem}
body.playing .grid,body.playing .modes,body.playing .tools{opacity:.12;pointer-events:none}
.modes,.tools{transition:opacity .4s}
@media (max-width:600px){.hud{grid-template-columns:repeat(2,1fr);gap:12px}.box{padding:22px 20px}main{padding:28px 16px 72px}#res{padding:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header>
<h1 class="logo">Type<i>Rush</i></h1>
<div class="tools"><div class="chip" id="rk"></div><button class="ic" id="snd" aria-label="Alternar som" title="Som"></button></div>
</header>

<div class="modes" role="group" aria-label="Modo de jogo">
<button data-m="15" aria-pressed="false">15 s</button>
<button data-m="30" aria-pressed="false">30 s</button>
<button data-m="60" aria-pressed="true">60 s</button>
<button data-m="dia" aria-pressed="false">Desafio do dia</button>
</div>

<div id="arena">
<div class="bar"><div id="bar"></div></div>
<div class="hud">
<div class="card w"><b id="sw">0</b><span>palavras por minuto</span></div>
<div class="card"><b id="sa">100%</b><span>precisão</span></div>
<div class="card"><b id="st">60</b><span id="stl">segundos restantes</span></div>
<div class="card c" id="cc"><b id="cb">×0</b><span>combo de acertos</span></div>
</div>
<div class="box" id="box">
<div id="words"></div>
<input id="inp" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Digite o texto exibido">
</div>
<p class="hint">Clique no texto e comece a digitar. <kbd>Tab</kbd> reinicia com texto novo.</p>
</div>

<div id="res" hidden>
<div class="rk" id="rrank"></div>
<div class="rbig">
<div><b id="rw" style="color:var(--acc)">0</b><span>palavras por minuto</span></div>
<div><b id="ra">0%</b><span>precisão</span></div>
<div><b id="rcb" style="color:var(--gold)">0</b><span>melhor combo</span></div>
</div>
<div id="spark"></div>
<p id="rmsg"></p>
<div class="btns"><button class="btn" id="again">Jogar de novo</button><button class="btn alt" id="nxt">Texto novo</button></div>
</div>

<div class="grid">
<section><h2>Recordes pessoais</h2><div id="recs"></div></section>
<section><h2>Desafio do dia</h2><div id="daily"></div></section>
<section class="wide"><h2>Evolução nos últimos 20 testes</h2><div class="chart" id="chart"></div></section>
<section class="wide"><h2>Histórico recente</h2><div id="hist"></div></section>
</div>
</main>

<script>
const $=s=>document.querySelector(s);
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const WORDS=("casa tempo vida mundo dia noite fazer olhar caminho rio mar praia sol chuva cidade amigo trabalho dinheiro sonho jogo tela teclado mouse rapido forte grande pequeno novo antigo claro escuro verde azul vermelho branco preto livro musica filme time ponto fase mapa ataque defesa equipe partida campeao treino foco ritmo meta plano projeto codigo site app dados rede nuvem senha conta cliente venda lucro preco valor mercado futuro hoje agora sempre nunca porque quando onde como depois antes ainda muito pouco todo cada outro mesmo ideia janela porta carro moto bola festa escola turma aula prova nota passo corrida salto vento fogo terra agua pedra ponte rua morro bairro familia irmao amiga pessoa historia conversa resposta pergunta caminhada semana mes ano hora minuto segundo").split(" ");
const LAB={"15":"15 s","30":"30 s","60":"60 s","dia":"Desafio do dia"};
const RANKS=[[100,"Lenda"],[80,"Mestre"],[60,"Elite"],[45,"Veloz"],[30,"Aprendiz"],[0,"Iniciante"]];
const rank=w=>RANKS.find(r=>w>=r[0])[1];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const today=()=>ymd(new Date());
function makeText(m){const r=m==="dia"?rng(hash("dia"+today())):Math.random,n=m==="dia"?35:260,o=[];let l="";for(let i=0;i<n;i++){let w;do{w=WORDS[Math.floor(r()*WORDS.length)]}while(w===l);o.push(w);l=w}return o.join(" ")}

let mem=null;
function load(){try{const v=localStorage.getItem("typerush_v1");if(v)return JSON.parse(v)}catch(e){}return mem||{hist:[],rec:{},daily:{},mute:false}}
function save(d){mem=d;try{localStorage.setItem("typerush_v1",JSON.stringify(d))}catch(e){}}
let mute=!!load().mute,AC=null;
function beep(f,d,v,t){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t||"triangle";o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
function sndIcon(){$("#snd").textContent=mute?"🔇":"🔊"}
$("#snd").onclick=()=>{mute=!mute;const d=load();d.mute=mute;save(d);sndIcon();beep(700,.08,.05)};

const inp=$("#inp"),wordsEl=$("#words"),box=$("#box");
let mode="60",text="",typed="",total=0,good=0,combo=0,best=0,samples=[],started=false,done=false,t0=0,limit=60,iv=null,cs=[];

function build(){
  cs=[];wordsEl.innerHTML="";wordsEl.scrollTop=0;
  text.split(" ").forEach((w,wi,arr)=>{
    const ws=document.createElement("span");ws.className="w";
    for(const ch of w){const s=document.createElement("span");s.textContent=ch;ws.appendChild(s);cs.push(s)}
    if(wi<arr.length-1){const sp=document.createElement("span");sp.textContent=" ";ws.appendChild(sp);cs.push(sp)}
    wordsEl.appendChild(ws);
  });
  setCls(0);
}
function setCls(i){const s=cs[i];if(!s)return;s.className=i<typed.length?(typed[i]===text[i]?"ok":"bad"):(i===typed.length?"cur":"")}
function scroll(){const c=cs[typed.length]||cs[typed.length-1];if(c)wordsEl.scrollTop=Math.max(0,c.offsetTop-c.offsetHeight*1.1)}
function correct(){let n=0;for(let i=0;i<typed.length;i++)if(typed[i]===text[i])n++;return n}
const liveWpm=el=>Math.round(correct()/5/(Math.max(el,1)/60));
function setCombo(){$("#cb").textContent="×"+combo}
function tick(){
  const el=(performance.now()-t0)/1000;
  if(limit){const left=limit-el;if(left<=0){finish();return}$("#st").textContent=Math.ceil(left);$("#bar").style.width=(el/limit*100)+"%"}
  else{$("#st").textContent=el.toFixed(1);$("#bar").style.width=(typed.length/text.length*100)+"%"}
  const w=liveWpm(el);$("#sw").textContent=w;
  $("#sa").textContent=(total?Math.round(good/total*100):100)+"%";
  if(Math.floor(el)>samples.length)samples.push(w);
}
function reset(m){
  if(m)mode=m;
  clearInterval(iv);document.body.classList.remove("playing");
  text=makeText(mode);typed="";total=good=combo=best=0;samples=[];started=done=false;
  limit=mode==="dia"?0:+mode;
  inp.value="";build();setCombo();
  $("#sw").textContent="0";$("#sa").textContent="100%";$("#bar").style.width="0";
  $("#st").textContent=limit||"0.0";
  $("#stl").textContent=limit?"segundos restantes":"segundos";
  document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===mode));
  $("#res").hidden=true;$("#arena").hidden=false;
  inp.focus();
}
function countUp(el,to){
  if(RM||!to){el.textContent=to;return}
  const s=performance.now();(function f(n){const p=Math.min((n-s)/800,1);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s);
}
function spark(a){
  if(a.length<2)return"";
  const W=600,H=70,mx=Math.max(...a,1),X=i=>i*W/(a.length-1),Y=v=>H-6-v/mx*(H-12);
  const p=a.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
  return'<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="PPM a cada segundo"><polygon points="0,'+H+' '+p+' '+W+','+H+'" fill="var(--acc)" opacity=".18"/><polyline points="'+p+'" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/></svg>';
}
function finish(){
  if(done)return;done=true;clearInterval(iv);document.body.classList.remove("playing");
  const el=limit||Math.max((performance.now()-t0)/1000,1),cc=correct();
  const wpm=Math.round(cc/5/(el/60)),acc=total?Math.round(good/total*100):100;
  samples.push(wpm);
  const d=load(),prevRec=d.rec[mode]||0,isRec=wpm>prevRec&&wpm>0;
  d.hist.push({t:Date.now(),m:mode,w:wpm,a:acc});d.hist=d.hist.slice(-200);
  if(isRec)d.rec[mode]=wpm;
  let msg=isRec?(prevRec?"Novo recorde pessoal! O anterior era "+prevRec+" PPM.":"Primeiro resultado neste modo: esse é o seu recorde inicial."):"Seu recorde neste modo é "+prevRec+" PPM.";
  const nx=[...RANKS].reverse().find(r=>r[0]>wpm);
  if(nx)msg+=" Faltam "+(nx[0]-wpm)+" PPM para o rank "+nx[1]+".";
  if(mode==="dia"){const k=today(),p=d.daily[k];if(!p||wpm>p.w)d.daily[k]={w:wpm,a:acc};msg+=" Melhor do dia: "+d.daily[k].w+" PPM."}
  save(d);
  $("#rrank").textContent="Rank "+rank(wpm);
  countUp($("#rw"),wpm);$("#ra").textContent=acc+"%";$("#rcb").textContent=best;
  $("#spark").innerHTML=spark(samples);$("#rmsg").textContent=msg;
  $("#arena").hidden=true;$("#res").hidden=false;$("#again").focus();
  beep(523,.12,.06);setTimeout(()=>beep(659,.12,.06),110);setTimeout(()=>beep(isRec?1046:784,.25,.06),220);
  panels();
}
inp.addEventListener("input",()=>{
  if(done)return;
  let v=inp.value;if(v.length>text.length)v=v.slice(0,text.length);
  const prev=typed.length;
  if(!started&&v.length){started=true;t0=performance.now();iv=setInterval(tick,100);document.body.classList.add("playing")}
  for(let i=prev;i<v.length;i++){
    total++;
    if(v[i]===text[i]){good++;combo++;if(combo>best)best=combo;beep(480+Math.min(combo,40)*8,.03,.025);if(combo%10===0){const c=$("#cc");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");beep(880,.08,.05)}}
    else{combo=0;beep(140,.09,.05,"sawtooth");box.classList.remove("shake");void box.offsetWidth;box.classList.add("shake")}
  }
  setCombo();
  typed=v;inp.value=v;
  for(let i=Math.max(0,Math.min(prev,v.length)-1);i<=Math.max(prev,v.length);i++)setCls(i);
  scroll();
  if(v.length===text.length&&mode==="dia")finish();
});
inp.addEventListener("paste",e=>e.preventDefault());
inp.addEventListener("focus",()=>box.classList.add("on"));inp.addEventListener("blur",()=>box.classList.remove("on"));
document.addEventListener("keydown",e=>{if(e.key==="Tab"&&!e.shiftKey&&!$("#arena").hidden){e.preventDefault();reset()}});
box.addEventListener("click",()=>inp.focus());
document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>reset(b.dataset.m));
$("#again").onclick=()=>reset();$("#nxt").onclick=()=>reset();

function streak(d){let n=0,c=new Date();if(!d.daily[ymd(c)])c.setDate(c.getDate()-1);while(d.daily[ymd(c)]){n++;c.setDate(c.getDate()-1)}return n}
function fmt(t){const x=new Date(t);return String(x.getDate()).padStart(2,"0")+"/"+String(x.getMonth()+1).padStart(2,"0")}
function panels(){
  const d=load(),bestAll=Math.max(0,...Object.values(d.rec));
  $("#rk").innerHTML=bestAll?"Rank <b>"+rank(bestAll)+"</b> · "+bestAll+" PPM":"Sem rank ainda";
  $("#recs").innerHTML=["15","30","60","dia"].map(m=>'<div class="rec"><span>'+LAB[m]+'</span><b>'+(d.rec[m]?d.rec[m]+" PPM":"—")+'</b></div>').join("");
  const td=d.daily[today()],s=streak(d);let wk="";
  for(let i=6;i>=0;i--){const c=new Date();c.setDate(c.getDate()-i);wk+='<div class="'+(d.daily[ymd(c)]?"on":"")+'"><i></i>'+c.toLocaleDateString("pt-BR",{weekday:"narrow"})+'</div>'}
  $("#daily").innerHTML='<div class="rec"><span>Hoje</span><b>'+(td?td.w+" PPM · "+td.a+"%":"ainda não jogou")+'</b></div><div class="rec"><span>Dias seguidos</span><b>'+s+'</b></div><div class="week">'+wk+'</div><p class="empty">O texto muda todo dia e é igual para quem joga na mesma data. Vale o melhor resultado.</p>';
  const h=d.hist.slice(-20);
  if(h.length<2){$("#chart").innerHTML='<p class="empty">Faça pelo menos 2 testes para ver sua evolução.</p>'}
  else{
    const W=640,H=170,px=34,py=18,lo=Math.max(0,Math.floor(Math.min(...h.map(x=>x.w))*.8)),hi=Math.ceil(Math.max(...h.map(x=>x.w),10)*1.1);
    const X=i=>px+i*(W-px-10)/(h.length-1),Y=v=>H-py-(v-lo)/(hi-lo||1)*(H-py*2);
    const pts=h.map((x,i)=>X(i).toFixed(1)+","+Y(x.w).toFixed(1)).join(" ");
    $("#chart").innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de PPM dos últimos testes"><line x1="'+px+'" x2="'+W+'" y1="'+Y(lo)+'" y2="'+Y(lo)+'" stroke="var(--line)"/><line x1="'+px+'" x2="'+W+'" y1="'+Y(hi)+'" y2="'+Y(hi)+'" stroke="var(--line)"/><text x="0" y="'+(Y(hi)+4)+'" fill="var(--mute)" font-size="12">'+hi+'</text><text x="0" y="'+(Y(lo)+4)+'" fill="var(--mute)" font-size="12">'+lo+'</text><polygon points="'+X(0)+','+Y(lo)+' '+pts+' '+X(h.length-1)+','+Y(lo)+'" fill="var(--acc)" opacity=".15"/><polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>'+h.map((x,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(x.w).toFixed(1)+'" r="3.5" fill="var(--gold)"><title>'+fmt(x.t)+" · "+x.w+" PPM</title></circle>").join("")+'</svg>';
  }
  $("#hist").innerHTML=d.hist.length?d.hist.slice(-6).reverse().map(x=>'<div class="rec"><span>'+fmt(x.t)+" · "+LAB[x.m]+'</span><b>'+x.w+" PPM · "+x.a+'%</b></div>').join(""):'<p class="empty">Seus testes aparecem aqui assim que você terminar o primeiro.</p>';
}
sndIcon();panels();reset("60");
</script>
</body>
</html>
